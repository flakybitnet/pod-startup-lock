apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: database
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      name: postgres
      labels:
        app.kubernetes.io/name: postgres
    spec:
      initContainers:
        - name: psl
          image: registry.gitlab.com/flakybitnet/pod-startup-lock/init:2.0.1
          env:
            - name: PSL_LOCK_HOST
              value: lock.psl.svc.cluster.local
            - name: PSL_LOCK_CHECK_PERIOD
              value: 5s
            - name: PSL_LOCK_DURATION
              value: 20s
          resources:
            requests:
              cpu: 20m
              memory: 4Mi
            limits:
              cpu: 100m
              memory: 8Mi
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16.2-bookworm
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi
