apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lock
  namespace: psl
  labels:
    app.kubernetes.io/name: lock
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lock
  template:
    metadata:
      name: lock
      labels:
        app.kubernetes.io/name: lock
    spec:
      containers:
        - name: lock
          image: registry.gitlab.com/flakybitnet/pod-startup-lock/lock:2.0.1
          envFrom:
            - configMapRef:
                name: lock
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 8Mi
            limits:
              cpu: 500m
              memory: 16Mi
