# Generate manifests

init-man:
  stage: manifest
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
  image: $IMG_BUILDAH
  variables:
    STORAGE_DRIVER: vfs
    APP_COMPONENT: init
    OCI_NAME: $CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME
  script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
