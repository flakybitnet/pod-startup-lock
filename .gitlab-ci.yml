    - buildah manifest add "$OCI_NAME" "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-amd64"
    - buildah manifest add "$OCI_NAME" "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-arm"
