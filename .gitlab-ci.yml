    matrix:
      - GOARCH:
        - amd64
        - arm
        - arm64
  script:
    - mkdir dist/
    - cd "$APP_COMPONENT"
    - go build -v -a -o "../dist/$APP_COMPONENT-$GOARCH"
  artifacts:
    paths:
      - dist

# Package images

init-img:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - init-bin
  image: $IMG_BUILDAH
  variables:
    STORAGE_DRIVER: vfs
    APP_COMPONENT: init
  parallel:
    matrix:
      - ARCH:
          - amd64
          - arm
          - arm64
  script:
    - mkdir bin
    - mv "dist/$APP_COMPONENT-$ARCH" bin/app
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah build
      --platform=linux/$ARCH
      --tag "$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-$ARCH"
      --file .oci/Containerfile
    - buildah push "$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-$ARCH"

