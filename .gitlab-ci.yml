    - skopeo copy --all "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-debug" "docker://$REGISTRY/$IMAGE:$CI_COMMIT_REF_NAME-debug"

amazon-img-mrrr:
  stage: mirror
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
  image:
    name: $IMG_SKOPEO
    entrypoint: [ "" ]
  variables:
    REGISTRY: public.ecr.aws
    IMAGE: flakybitnet/psl/$APP_COMPONENT
    GIT_STRATEGY: none
    AWS_ACCESS_KEY_ID: $ECR_USER
    AWS_SECRET_ACCESS_KEY: $ECR_PASSWORD
  parallel:
    matrix:
      - APP_COMPONENT:
        - init
        - k8s-health
        - lock
  script:
    - printf '{"credHelpers":{"%s":"%s"}}' "$REGISTRY" 'ecr-login' > "$HOME/auth.json"
    - skopeo copy --all "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME" "docker://$REGISTRY/$IMAGE:$CI_COMMIT_REF_NAME"
      --dest-authfile="$HOME/auth.json"
    - skopeo copy --all "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-debug" "docker://$REGISTRY/$IMAGE:$CI_COMMIT_REF_NAME-debug"
      --dest-authfile="$HOME/auth.json"
