# Mirror Git

github-git-mrrr:
  stage: mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'
  dependencies: []
  image:
    name: $IMG_GIT
    entrypoint: [ "" ]
  variables:
    GIT_STRATEGY: clone
  script:
    - git remote add github "https://$GITHUB_USER:$GITHUB_PASSWORD@github.com/flakybitnet/pod-startup-lock.git"
    - if [ -n "${CI_COMMIT_BRANCH-}" ]; then
        git checkout -b "$CI_COMMIT_BRANCH";
        git fetch github;
        git push --force-with-lease github "$CI_COMMIT_BRANCH";
        fi
    - if [ -n "${CI_COMMIT_TAG-}" ]; then
        git push github tag $CI_COMMIT_TAG;
        fi

# Mirror images

github-img-mrrr:
  stage: mirror
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
  image:
    name: $IMG_SKOPEO
    entrypoint: [ "" ]
  variables:
    REGISTRY: ghcr.io
    IMAGE: flakybitnet/psl-$APP_COMPONENT
    GIT_STRATEGY: none
  parallel:
    matrix:
      - APP_COMPONENT:
        - init
        - k8s-health
        - lock
  script:
    - echo "$GITHUB_PASSWORD" | skopeo login -u "$GITHUB_USER" --password-stdin "$REGISTRY"
    - skopeo copy --all "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME" "docker://$REGISTRY/$IMAGE:$CI_COMMIT_REF_NAME"
    - skopeo copy --all "docker://$CI_REGISTRY_IMAGE/$APP_COMPONENT:$CI_COMMIT_REF_NAME-debug" "docker://$REGISTRY/$IMAGE:$CI_COMMIT_REF_NAME-debug"

