stages:
  - test
  - build
  - package
  - manifest
  - mirror

variables:
  CGO_ENABLED: 0
  GOOS: linux
  IMG_GOLANG: public.ecr.aws/docker/library/golang:1.27.3-trixie
  IMG_BUILDAH: quay.io/buildah/stable:v1.43.5
  IMG_GIT: docker.io/alpine/git:v2.54.0
  IMG_SKOPEO: public.ecr.aws/flakybitnet/skopeo:1.22.3-fb1

# Test

all-test:
  stage: test
  image: $IMG_GOLANG
  parallel:
    matrix:
      - APP_COMPONENT:
        - init
        - k8s-health
        - lock
  script:
    - cd "$APP_COMPONENT"
    - go test -cover -v ./...

# Compile binaries

init-bin:
  stage: build
  image: $IMG_GOLANG
  variables:
    APP_COMPONENT: init
  parallel:
    matrix:
      - GOARCH:
        - amd64
        - arm
        - arm64
  script:
    - mkdir dist/
    - cd "$APP_COMPONENT"
    - go build -v -a -o "../dist/$APP_COMPONENT-$GOARCH"
  artifacts:
    paths:
      - dist

k8s-health-bin:
  stage: build
  image: $IMG_GOLANG
  variables:
    APP_COMPONENT: k8s-health
  parallel:
    matrix:
      - GOARCH:
        - amd64
        - arm
        - arm64
  script:
    - mkdir dist/
    - cd "$APP_COMPONENT"
    - go build -v -a -o "../dist/$APP_COMPONENT-$GOARCH"
  artifacts:
    paths:
      - dist

